[package]
name = "cmux-agents-sidebar"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Attention-first agents sidebar plugin for the cmux terminal multiplexer"
repository = "https://github.com/toshipon/cmux-agents-sidebar"
readme = "README.md"

[dependencies]
anyhow = "1.0.100"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "cmux_agents_sidebar"
path = "src/lib.rs"

[[bin]]
name = "cmux-agents-sidebar"
path = "src/main.rs"
